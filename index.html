<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>酸素ボンベ計算ツール</title>

<style>
:root{
  --main:#1976d2;
  --safe:#2e7d32;
  --warn:#d64545;
  --card:#ffffff;
  --bg:#eef4fb;
}

*{box-sizing:border-box;}

body{margin:0;
     padding:20px;
     font-family:"Hiragino Sans","Yu Gothic",sans-serif;
     background:linear-gradient(180deg,#edf5ff,#dfeeff);
     color:#222;}

.container{max-width:900px;
           margin:auto;}

  .card{background:var(--card);
        border-radius:24px;
        padding:24px;
        box-shadow:0 10px 30px rgba(0,0,0,0.12);}

h1{margin-top:0;
   margin-bottom:20px;
   font-size:30px;
   text-align:center;
   color:var(--main);}

label{display:block;
      margin-top:18px;
      margin-bottom:6px;
      font-size:18px;
      font-weight:bold;}

input,
select{width:100%;
       padding:14px;
       border-radius:14px;
       border:1px solid #cfd8dc;
       font-size:18px;
       background:#fff;}
input{max-width:100%;}

input:focus,
select:focus{outline:none;
             border-color:var(--main);box-shadow:0 0 0 4px rgba(25,118,210,0.15);}

/* ===== 入力項目の色分け ===== */

/* FiO2（赤） */
#fio2,
#fio2_v{
    background:#ffe5e5;
}

/* 分時換気量（黄色） */
#totalFlow,
#mv_v{
    background:#fff8cc;
}

/* リーク量（緑） */
#leak{
    background:#e8f8e8;
}
  
.inputRow{display:flex;align-items:center;gap:12px;}

.inputRow input{
    flex:0.75;
    min-width:0;
}

.pressureImg{
width:100px;
height:auto;
flex-shrink:0;
}

.flowImg{
width:60px;
height:auto;
flex-shrink:0;
}

.quickBtns{display:flex;gap:10px;
           margin-top:14px;}

.quickBtns button{flex:1;
                  border:none;
                  border-radius:14px;
                  background:var(--main);
                  color:white;
                  padding:14px;
                  font-size:16px;
                  font-weight:bold;
                  cursor:pointer;
                  transition:0.2s;}

.quickBtns button:hover{
  transform:translateY(-2px);
  opacity:0.95;}

.calc{width:100%;
      margin-top:24px;
      padding:18px;
      border:none;
      border-radius:18px;
  background:#43a047;
      color:white;
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;}

.calc:hover{transform:translateY(-2px);
            opacity:0.95;}

.note{margin-top:10px;
      margin-bottom:20px;
      font-size:16px;
      color:#555;
     }

.tapNote{
display:inline;
margin-bottom:12px;
padding:6px 12px;

font-size:18px;
font-weight:bold;
color:#222;

background:
linear-gradient(
transparent 55%,
#fff59d 55%
);

border-radius:6px;
}

.small{font-size:13px;
       font-weight:normal;}

.result{margin-top:24px;
        padding:20px;
        border-radius:18px;background:#f5f9ff;
 　　　 border:2px solid #d7e7ff;
        text-align:center;}

.resultTime{font-size:38px;
            font-weight:bold;color:#0d47a1;}

.resultFlow{margin-top:10px;
            font-size:20px}

.warn{margin-top:16px;
      color:var(--warn);
      font-size:22px;
      font-weight:bold;}

.safe{margin-top:16px;
      color:var(--safe);
      font-size:22px;
      font-weight:bold;}

.footer{margin-top:20px;
        text-align:center;
        font-size:14px;
        color:#777;}

.nppvLayout{
display:flex;
gap:24px;
align-items:flex-start;
margin-top:16px;
}

.nppvLeft{
flex:0.7;
min-width:110px;
}

.nppvRight{
    flex:1.6;
    min-width:0;
}

.screenImg{
width:100%;
max-width:240px;
height:auto;
}

.screenWrap{
position:relative;
}

.screenImg{
width:100%;
max-width:280px;
height:auto;
border-radius:14px;
border:2px solid #ccc;
display:block;
}

.hotspot{
position:absolute;
background:transparent;
border:none;
cursor:pointer;
z-index:10;

padding:0;
margin:0;

appearance:none;
-webkit-appearance:none;

font-size:0;
line-height:0;
}

.hotspot:hover{
background:transparent;
}
  
.inputHighlight{
border:3px solid #ff9800 !important;
background:#fff8e1;
}
  
@media(max-width:700px){

  .nppvLeft{
    flex:0.6;
    min-width:0;
  }

  .nppvRight{
    flex:1.4;
    min-width:0;
  }

  .nppvLeft input{
    padding:10px;
    font-size:16px;
  }

  .screenImg{
    width:100%;
    max-width:220px;
    height:auto;
  }

}


@media(max-width:600px){

  body{padding:12px;}

  .card{padding:18px;}

  h1{
   font-size:22px;
   line-height:1.5;
 }
  
 .inputRow{
flex-direction:row;
align-items:center;
}

  .pressureImg,
  .flowImg{max-width:100%;height:auto;}

  .quickBtns{flex-direction:row;}
}

/* 背景警告 */

body.safeBg{
background:linear-gradient(180deg,#edf5ff,#dfeeff);
transition:0.5s;
}

body.cautionBg{
background:linear-gradient(180deg,#fff3cd,#ffe08a);
transition:0.5s;
}

body.dangerBg{
background:linear-gradient(180deg,#ffcccc,#ff8a8a);
transition:0.5s;
}

.helpText{
    margin-top:-2px;
    margin-bottom:8px;
    padding:8px 12px;

    background:#eef7ff;
    border-left:5px solid #1976d2;

    font-size:15px;
    color:#333;

    border-radius:8px;
}

.emptyTime{
    margin-top:15px;
    font-size:32px;
    font-weight:bold;
    color:#d32f2f;
    line-height:1.4;
}

.resultTitle{
    font-size:18px;
    color:#666;
    margin-bottom:5px;
    font-weight:bold;
}

.resultTime{
    font-size:48px;
    font-weight:bold;
    color:#0d47a1;
}

.emptyTitle{
    margin-top:20px;
    font-size:18px;
    color:#666;
    font-weight:bold;
}

.emptyTime{
    font-size:38px;
    font-weight:bold;
    color:#d32f2f;
    line-height:1.3;
    margin-top:5px;
}
  
</style>
</head>

<body>

<div class="container">

  <div class="card">

 <h1>
酸素ボンベ計算ツール<br>
<span>【つがる総合病院】</span>
</h1>

    <label>モード</label>

    <select id="mode">
      <option value="normal">カニューレ・マスク</option>
      <option value="nppv">NPPV（バイパップ）</option>
      <option value="vent">呼吸器</option>
    </select>

    <!-- NPPV機種選択 -->
<div id="nppvMachineArea" style="display:none;margin-top:10px;">
<label>NPPV機種選択</label>

  <div class="helpText">
使用しているNPPV機種を選択してください
</div>
  
<select id="nppvMachine" onchange="changeNPPVMachine()">

<option value="nkv">NKVｰ330</option>
<option value="v60">V60</option>
  
</select>

</div>

<!-- 呼吸器機種選択 -->
<div id="ventMachineArea" style="display:none;margin-top:10px;">

<label>呼吸器機種選択</label>

  <div class="helpText">
使用している呼吸器機種を選択してください
</div>

<select id="ventMachine" onchange="changeVentMachine()">
 
  <option value="monnal">monnal T60</option>
  <option value="servo">Servo-air</option>
  
</select>

</div>

    <label>ボンベ圧（MPa）</label>

    <div class="helpText">
①圧力計を確認して現在の圧力を入力または、下記の選択から該当する圧力をタップしてください
</div>

    <div class="inputRow">
      <input id="pressure"
       type="number"
       min="0"
       max="14.7"
       step="0.1"
       placeholder="例：10">
      
      <img src="pressuregauge.png" 
      alt="圧力計" 
      class="pressureImg">
      
    </div>

    <div class="quickBtns">
      <button onclick="setPressureAndCalc(14.7)">
        14.7MPa<br>
        <span class="small">（満タン）</span>
      </button>

      <button onclick="setPressureAndCalc(10)">
        10MPa
      </button>

      <button onclick="setPressureAndCalc(5)">
        5MPa
      </button>
    </div>

    <div class="note">
      ※ 酸素ボンベの満タンは14.7MPaです
    </div>

    <!-- カニューレ・マスク -->
    <div id="normalFields">

      <label>流量（L/min）</label>

      <div class="helpText">
②流量計の設定値を入力してください
</div>

      <div class="inputRow">
        
        <input id="flow"
       type="number"
       min="0"
       max="15"
       step="0.5"
       placeholder="例：3">
        
        <img src="flowmeter.png" 
        alt="流量計" 
        class="flowImg">
        
      </div>

    </div>

    <!-- NPPV -->
<div id="nppvFields" style="display:none;">

   <div class="helpText">
② モニター画面のFiO₂・分時換気量・リーク量を入力してください
</div>

<div class="nppvLayout">

  <!-- 左：入力欄 -->
  <div class="nppvLeft">

    <label>FiO2（%）</label>
    
    <input id="fio2"
       type="number"
       min="21"
       max="100"
       placeholder="例：60">

    <label>分時換気量（L/min）</label>
    
    <input id="totalFlow" type="number" placeholder="例：8">

    <label>リーク量（L/min）</label>

    <input id="leak" type="number" placeholder="自動20">

  </div>

  <!-- 右：画像 -->
  <div class="nppvRight">

    <div class="tapNote">
      画像の黄色枠をタップすると、対応する入力欄へ移動します
    </div>


<!-- V60 -->
<div class="screenWrap" id="v60Wrap">

  <img src="V60丸.png" class="screenImg">

  <!-- 分時換気量 -->
  <button class="hotspot"
  style="top:8%;left:50%;width:30%;height:22%;"
  onclick="focusInput('totalFlow')"></button>

  <!-- リーク -->
  <button class="hotspot"
  style="top:15%;left:2%;width:30%;height:22%;"
  onclick="focusInput('leak')"></button>

  <!-- FiO2 -->
  <button class="hotspot"
  style="bottom:8%;left:20%;width:24%;height:22%;"
  onclick="focusInput('fio2')"></button>

</div>

<!-- NKV -->
<div class="screenWrap" id="nkvWrap" style="display:none;">

  <img src="NKV丸.png" class="screenImg">

  <!-- 分時換気量 -->
  <button class="hotspot"
  style="top:22%;left:1%;width:30%;height:24%;"
  onclick="focusInput('totalFlow')"></button>

  <!-- リーク -->
  <button class="hotspot"
  style="top:64%;left:0%;width:32%;height:20%;"
  onclick="focusInput('leak')"></button>

  <!-- FiO2 -->
  <button class="hotspot"
  style="bottom:0%;left:52%;width:34%;height:20%;"
  onclick="focusInput('fio2')"></button>

</div>

  </div>

</div>

</div>
  
    <!-- 呼吸器 -->
<div id="ventFields" style="display:none;">

   <div class="helpText">
② モニター画面のFiO₂・分時換気量を入力してください
</div>


<div class="nppvLayout">

  <!-- 左入力 -->
  <div class="nppvLeft">

    <label>FiO2（%）</label>
  
    <input id="fio2_v"
       type="number"
       min="21"
       max="100"
       placeholder="例：60">

    <label>分時換気量（L/min）</label>
   
    <input id="mv_v" 
    type="number" 
    placeholder="例：8">

  </div>

  <!-- 右画像 -->
  <div class="nppvRight">

    <div class="tapNote">
      画像の黄色枠をタップすると、対応する入力欄へ移動します
    </div>

    <!-- Servo-air -->
    <div class="screenWrap" id="servoWrap">

      <img src="air丸.png" class="screenImg">

      <!-- MV -->
      <button class="hotspot"
      style="top:44%;left:54%;width:25%;height:28%;"
      onclick="focusInput('mv_v')"></button>

      <!-- FiO2 -->
      <button class="hotspot"
      style="bottom:0%;left:6%;width:22%;height:22%;"
      onclick="focusInput('fio2_v')"></button>

    </div>

    <!-- monnal -->
    <div class="screenWrap" id="monnalWrap" style="display:none;">

      <img src="monal丸.png" class="screenImg">

      <!-- MV -->
      <button class="hotspot"
      style="top:43%;left:42%;width:40%;height:38%;"
      onclick="focusInput('mv_v')"></button>

      <!-- FiO2 -->
      <button class="hotspot"
      style="bottom:0%;left:0%;width:24%;height:24%;"
      onclick="focusInput('fio2_v')"></button>

    </div>

  </div>

</div>

</div>

<script>

const CYLINDER_TOTAL = 500;
const FULL_PRESSURE = 14.7;
const SAFE = 2;

const mode = document.getElementById("mode");

mode.addEventListener("change", () => {

  // カニューレ・マスク
  document.getElementById("normalFields").style.display =
    (mode.value === "normal") ? "block" : "none";

  // NPPV機種選択
  document.getElementById("nppvMachineArea").style.display =
    (mode.value === "nppv") ? "block" : "none";

  // NPPV本体
  document.getElementById("nppvFields").style.display =
    (mode.value === "nppv") ? "block" : "none";

  // 呼吸器
  document.getElementById("ventFields").style.display =
    (mode.value === "vent") ? "block" : "none";
  // 呼吸器機種選択
document.getElementById("ventMachineArea").style.display =
  (mode.value === "vent") ? "block" : "none";

});

function setPressureAndCalc(value){

  document.getElementById("pressure").value = value;

}

function getFlow(){

  // カニューレ・マスク
  if(mode.value === "normal"){

    return parseFloat(
      document.getElementById("flow").value
    );
  if (flowValue > 15) {
      alert("流量は15L/min以下で入力してください");
      return;
    }

  }

  // NPPV
  if(mode.value === "nppv"){

    let fio2 =
      document.getElementById("fio2").value / 100;

    if (fio2 < 21 || fio2 > 100) {
        alert("FiO₂は21～100％で入力してください");
        return;
    }

    let mv =
      parseFloat(
        document.getElementById("totalFlow").value
      );

    let leakVal =
      document.getElementById("leak").value;

    let leak =
      leakVal === "" ? 20 : parseFloat(leakVal);

    return (mv + leak) *
      ((fio2 - 0.21) / 0.79);

  }

  // 呼吸器
  if(mode.value === "vent"){

    let fio2 =
      document.getElementById("fio2_v").value / 100;

     if (fio2 < 21 || fio2 > 100) {
        alert("FiO₂は21～100％で入力してください");
        return;
    }

    let mv =
      parseFloat(
        document.getElementById("mv_v").value
      );

    return Math.max(
      0,
      mv * ((fio2 - 0.21) / 0.79)
    );

  }
}

function calc(){

  let pressure =
    parseFloat(
      document.getElementById("pressure").value
    );

  let flow = getFlow();

// ボンベ圧の上限
if (pressure > 14.7) {
    alert("ボンベ圧は14.7MPa以下で入力してください");
    return;
}
  
  if(!pressure || pressure <= SAFE){

    alert("圧を確認してください");
    return;

  }

  if(!flow || flow <= 0){

    alert("設定を確認してください");
    return;

  }

  let usable =
    ((pressure - SAFE) / FULL_PRESSURE)
    * CYLINDER_TOTAL;

  let time = usable / flow;

  // 現在時刻
let now = new Date();

// 残り時間を加算
now.setMinutes(now.getMinutes() + Math.round(time));

// 時刻を表示用に整形
let hour = now.getHours();
let minute = now.getMinutes().toString().padStart(2,"0");

let emptyTime = hour + ":" + minute;

  let status = "";
  let exchange = "";

  // 背景色リセット
  document.body.classList.remove(
    "safeBg",
    "cautionBg",
    "dangerBg"
  );

  // 危険
  if(time < 10){

    status =
      "<div class='warn'>⚠ 危険（10分未満）</div>";

    exchange =
      "<div class='warn'>至急交換してください</div>";

    document.body.classList.add("dangerBg");

  }

  // 注意
  else if(time < 20){

    status =
      "<div class='warn'>⚠ 注意（20分未満）</div>";

    exchange =
      `<div class='warn'>
      あと ${Math.round(time - 5)} 分以内に交換推奨
      </div>`;

    document.body.classList.add("cautionBg");

  }

  // 安全
  else{

    status =
      "<div class='safe'>✔ 使用可能</div>";

    exchange =
      `<div class='safe'>
      約 ${Math.round(time - 10)} 分後に交換準備推奨
      </div>`;

    document.body.classList.add("safeBg");

  }

 document.getElementById("result").innerHTML =
`
<div class="resultTitle">
残り使用時間
</div>

<div class="resultTime">
${Math.round(time)}分
</div>

<div class="emptyTitle">
交換目安時刻
</div>

<div class="emptyTime">
${emptyTime}
</div>

${status}

${exchange}
`;
}

function changeNPPVMachine(){

let machine =
document.getElementById("nppvMachine").value;

document.getElementById("v60Wrap").style.display = "none";
document.getElementById("nkvWrap").style.display = "none";


if(machine === "nkv"){
document.getElementById("nkvWrap").style.display = "block";
}
  
if(machine === "v60"){
document.getElementById("v60Wrap").style.display = "block";
}


}

function focusInput(id){

document.querySelectorAll("input").forEach(el=>{
el.classList.remove("inputHighlight");
});

document.getElementById(id).focus();

document.getElementById(id).classList.add("inputHighlight");

document.getElementById(id).scrollIntoView({
behavior:"smooth",
block:"center"
});

}

changeNPPVMachine();

function changeVentMachine(){

let machine =
document.getElementById("ventMachine").value;

document.getElementById("servoWrap").style.display = "none";
document.getElementById("monnalWrap").style.display = "none";


if(machine === "monnal"){
document.getElementById("monnalWrap").style.display = "block";
}

if(machine === "servo"){
document.getElementById("servoWrap").style.display = "block";
}

}

changeVentMachine();  

</script>

<button class="calc" onclick="calc()">
  計算する
</button>

<div id="result" class="result">
  計算結果がここに表示されます
</div>

<div class="footer">
  酸素ボンベ管理ツール
</div>

  </div>

</div>
  
</body>
</html>
